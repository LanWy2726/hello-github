<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello GitHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1f2937 100%);
      color: #e6edf3;
    }
    .card {
      width: min(560px, 90vw);
      padding: 40px 36px;
      border: 1px solid #30363d;
      border-radius: 16px;
      background: rgba(22, 27, 34, 0.85);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 10px 0; color: #8b949e; line-height: 1.7; }
    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: #21262d;
      color: #79c0ff;
    }
    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 4px 14px;
      border-radius: 999px;
      background: #1f6feb;
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.08em;
    }
    footer { margin-top: 24px; font-size: 12px; color: #6e7681; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">FIRST REPOSITORY</div>
    <h1>Hello, GitHub 👋</h1>
    <p>这个页面是从本地仓库一步步推上来的。</p>
    <p>能用 <code>git push</code> 更新，也能用 GitHub Pages 免费发布。</p>
    <footer>惜事旧梦 · <span id="date"></span></footer>
  </main>
  <script>
    document.getElementById("date").textContent = new Date().toLocaleDateString("zh-CN");
  </script>
</body>
</html>
